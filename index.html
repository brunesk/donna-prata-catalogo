<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donna Prata — Joias em Prata 925 e Aço Inox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --marfim:  #F2EDE4;
      --marfim2: #EAE4DA;
      --black:   #1A1A1A;
      --gray:    #777;
      --lgray:   #C8C4BC;
      --white:   #FDFAF6;
      --red:     #c62828;
    }

    body {
      background: var(--marfim);
      color: var(--black);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--marfim);
      text-align: center;
      padding: 52px 24px 36px;
      border-bottom: 1px solid var(--lgray);
    }

    .logo-img {
      max-width: 420px;
      width: 80%;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    .header-tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 400;
      color: var(--black);
      letter-spacing: 0.5px;
    }

    .header-sub {
      margin-top: 10px;
      font-size: 0.68rem;
      color: var(--gray);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── FILTROS ── */
    .filters-wrap {
      border-bottom: 1px solid var(--lgray);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters-wrap::-webkit-scrollbar { display: none; }

    .filters {
      display: flex;
      justify-content: center;
      min-width: max-content;
      margin: 0 auto;
    }

    .filter-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--gray);
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 2.5px;
      padding: 18px 22px;
      cursor: pointer;
      transition: all .2s;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .filter-btn:hover { color: var(--black); }

    .filter-btn.active {
      color: var(--black);
      border-bottom-color: var(--black);
    }

    .filter-btn.outlet-btn { color: #b46060; }
    .filter-btn.outlet-btn:hover,
    .filter-btn.outlet-btn.active { color: var(--red); border-bottom-color: var(--red); }

    /* ── GRID ── */
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--lgray);
      margin: 0;
    }

    /* ── CARD ── */
    .card {
      background: var(--marfim);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--marfim2);
      transition: transform .5s ease;
    }

    .card:hover .card-img { transform: scale(1.04); }

    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: var(--marfim2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lgray);
      font-size: 0.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .outlet-ribbon {
      position: absolute;
      top: 14px;
      left: 0;
      background: var(--red);
      color: #fff;
      font-size: 0.58rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
    }

    .card-body {
      padding: 18px 20px 22px;
    }

    .card-tag {
      font-size: 0.58rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 8px;
    }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--black);
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .card-material {
      font-size: 0.7rem;
      color: var(--gray);
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--black);
    }

    .card-stock {
      font-size: 0.58rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 3px 9px;
    }

    .stock-ok  { background: transparent; border: 1px solid var(--lgray); color: var(--gray); }
    .stock-low { background: #fdf0e0; border: 1px solid #e8c080; color: #a06020; }
    .stock-out { background: #fce4e4; border: 1px solid #e0a0a0; color: var(--red); }

    /* ── MODAL ── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,20,14,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-bg.open { display: flex; }

    .modal {
      background: var(--white);
      max-width: 860px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 640px) {
      .modal { grid-template-columns: 1fr; }
    }

    .modal-img {
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
      display: block;
      background: var(--marfim2);
    }

    .modal-img-placeholder {
      width: 100%;
      min-height: 320px;
      background: var(--marfim2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lgray);
    }

    .modal-body {
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
    }

    .modal-tag {
      font-size: 0.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 10px;
    }

    .modal-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      font-weight: 400;
      color: var(--black);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .modal-price {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: var(--black);
      margin-bottom: 22px;
    }

    .divider {
      height: 1px;
      background: var(--lgray);
      margin-bottom: 20px;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 18px;
      flex: 1;
    }

    .modal-info {
      font-size: 0.78rem;
      color: var(--gray);
      margin-bottom: 5px;
    }

    .modal-info strong { color: var(--black); font-weight: 500; }

    .modal-sizes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .modal-size {
      border: 1px solid var(--lgray);
      color: var(--gray);
      padding: 7px 15px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Inter', sans-serif;
    }

    .modal-size:hover,
    .modal-size.selected {
      border-color: var(--black);
      color: var(--black);
      background: var(--marfim);
    }

    .btn-whatsapp {
      display: block;
      width: 100%;
      background: var(--black);
      color: var(--marfim);
      text-align: center;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      margin-top: 22px;
      transition: background .2s;
    }

    .btn-whatsapp:hover { background: #333; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--gray);
      z-index: 10;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .2s;
    }

    .modal-close:hover { color: var(--black); }

    /* ── FOOTER ── */
    footer {
      background: var(--black);
      color: var(--lgray);
      text-align: center;
      padding: 52px 24px;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--marfim);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .footer-sub {
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 28px;
    }

    .footer-info {
      font-size: 0.78rem;
      color: #666;
      line-height: 2.2;
    }

    .footer-info a {
      color: var(--lgray);
      text-decoration: none;
      transition: color .2s;
    }

    .footer-info a:hover { color: var(--marfim); }

    .footer-slogan {
      margin-top: 32px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: #555;
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 24px;
      color: var(--gray);
      background: var(--marfim);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <img src="logo.png" alt="Donna Prata" class="logo-img">
  <div class="header-tagline">A peça que faltava no seu look</div>
  <div class="header-sub">Prata 925 &nbsp;·&nbsp; Aço Inox &nbsp;·&nbsp; Semijoias</div>
</header>

<!-- FILTROS -->
<div class="filters-wrap">
  <div class="filters">
    <button class="filter-btn active" data-cat="todos">Todos</button>
    <button class="filter-btn" data-cat="bracelet">Braceletes</button>
    <button class="filter-btn" data-cat="anel">Anéis</button>
    <button class="filter-btn" data-cat="pulseira">Pulseiras</button>
    <button class="filter-btn" data-cat="brinco">Brincos</button>
    <button class="filter-btn" data-cat="colar">Colares</button>
    <button class="filter-btn outlet-btn" data-cat="outlet">Outlet</button>
  </div>
</div>

<!-- CATÁLOGO -->
<div class="catalog" id="catalog"></div>

<!-- MODAL -->
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <span class="modal-close" onclick="closeModalDirect()">✕</span>
    <div id="modal-img-wrap"></div>
    <div class="modal-body">
      <div class="modal-tag" id="modal-tag"></div>
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-price" id="modal-price"></div>
      <div class="divider"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-info" id="modal-material"></div>
      <div class="modal-info" id="modal-stock-info"></div>
      <div class="modal-sizes" id="modal-sizes"></div>
      <a class="btn-whatsapp" id="modal-cta" href="#" target="_blank">Quero essa peça</a>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo">Donna Prata</div>
  <div class="footer-sub">Joias em Prata 925 &amp; Aço Inox</div>
  <div class="footer-info">
    <div>📍 Ibiúna, SP · Entregas locais e envios para todo o Brasil</div>
    <div>
      <a href="https://wa.me/5515996500066">WhatsApp</a>
      &nbsp;·&nbsp;
      <a href="https://instagram.com/a.donnaprata">@a.donnaprata</a>
    </div>
  </div>
  <div class="footer-slogan">Seja Donna Prata ✨</div>
</footer>

<script>
const WA = "5515996500066";
let produtos = [];
let currentFilter = "todos";
let selectedSizes = {};

async function carregarProdutos() {
  try {
    const r = await fetch(`produtos.json?t=${Date.now()}`);
    produtos = await r.json();
  } catch {
    produtos = [];
  }
  renderCatalog();
}

function stockLabel(n) {
  if (n === 0) return { text: "Esgotado",          cls: "stock-out" };
  if (n === 1) return { text: "Última unidade",    cls: "stock-low" };
  if (n <= 3)  return { text: `${n} unid.`,        cls: "stock-low" };
  return               { text: `${n} disponíveis`, cls: "stock-ok"  };
}

function catLabel(c) {
  return { bracelet:"Bracelet", anel:"Anel", pulseira:"Pulseira", brinco:"Brinco", colar:"Colar", outlet:"Outlet" }[c] || c;
}

function renderCatalog() {
  const list = produtos.filter(p => currentFilter === "todos" || p.categoria === currentFilter);
  const el = document.getElementById("catalog");

  if (!list.length) {
    el.innerHTML = '<div class="empty">Nenhuma peça nessa categoria por enquanto.</div>';
    return;
  }

  el.innerHTML = list.map(p => {
    const s = stockLabel(p.estoque);
    const imgTag = p.foto
      ? `<img class="card-img" src="${p.foto}" alt="${p.nome}" loading="lazy">`
      : `<div class="card-img-placeholder">sem foto</div>`;
    const outlet = p.categoria === 'outlet' ? `<div class="outlet-ribbon">Outlet</div>` : '';
    return `
      <div class="card" onclick="openModal(${p.id})">
        <div class="card-img-wrap">
          ${imgTag}
          ${outlet}
        </div>
        <div class="card-body">
          <div class="card-tag">${catLabel(p.categoria)}</div>
          <div class="card-name">${p.nome}</div>
          <div class="card-material">${p.material}</div>
          <div class="card-footer">
            <span class="card-price">${p.preco}</span>
            <span class="card-stock ${s.cls}">${s.text}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCatalog();
  });
});

function openModal(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;

  const s = stockLabel(p.estoque);
  document.getElementById('modal-img-wrap').innerHTML = p.foto
    ? `<img class="modal-img" src="${p.foto}" alt="${p.nome}">`
    : `<div class="modal-img-placeholder">—</div>`;

  document.getElementById('modal-tag').textContent      = catLabel(p.categoria);
  document.getElementById('modal-name').textContent     = p.nome;
  document.getElementById('modal-price').textContent    = p.preco;
  document.getElementById('modal-desc').textContent     = p.descricao;
  document.getElementById('modal-material').innerHTML   = `<strong>Material:</strong> ${p.material}`;
  document.getElementById('modal-stock-info').innerHTML = `<strong>Estoque:</strong> ${s.text}`;

  const sizesEl = document.getElementById('modal-sizes');
  if (p.tamanhos && p.tamanhos.length) {
    sizesEl.style.display = 'flex';
    sizesEl.innerHTML = `<div style="font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);width:100%;margin-bottom:6px">Tamanho</div>` +
      p.tamanhos.map(t =>
        `<div class="modal-size ${selectedSizes[id]===t?'selected':''}" onclick="selectSize(${id},'${t}',this)">${t}</div>`
      ).join('');
  } else {
    sizesEl.style.display = 'none';
    sizesEl.innerHTML = '';
  }

  updateCTA(p);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function selectSize(id, size, el) {
  selectedSizes[id] = size;
  document.querySelectorAll('.modal-size').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  updateCTA(produtos.find(x => x.id === id));
}

function updateCTA(p) {
  const cta  = document.getElementById('modal-cta');
  const size = selectedSizes[p.id] ? ` — Tamanho ${selectedSizes[p.id]}` : '';
  const msg  = encodeURIComponent(`Olá! Vi o catálogo da Donna Prata e quero: ${p.nome}${size} (${p.preco}) 💎`);
  if (p.estoque === 0) {
    cta.textContent = 'Produto esgotado';
    cta.style.background = '#ccc';
    cta.style.cursor = 'default';
    cta.href = '#';
  } else {
    cta.textContent = 'Quero essa peça';
    cta.style.background = 'var(--black)';
    cta.style.cursor = 'pointer';
    cta.href = `https://wa.me/${WA}?text=${msg}`;
  }
}

function closeModal(e) { if (e.target.id === 'modal') closeModalDirect(); }
function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

carregarProdutos();
</script>
</body>
</html>
